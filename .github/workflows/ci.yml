name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "ginx", "notify", "files", "directory"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: "${{ matrix.module }}/go.sum"
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
