name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "ginx", "notify", "files", "directory"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: byz
          POSTGRES_PASSWORD: byz
          POSTGRES_DB: byzplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U byz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # store and migrate integration tests run against the service container;
      # they skip when this is unset (local runs without Postgres).
      BYZ_TEST_DB_URL: postgres://byz:byz@127.0.0.1:5432/byzplatform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "${{ matrix.module }}/go.sum"
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      # depguard and style rules apply to the core module only (submodules
      # may import Gin / service SDKs that core must not).
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          args: ./...
